# Local Supabase CLI auth settings for the master app confirmation flow.
project_id = "schedule-masters-local"

[auth]
site_url = "http://localhost:8081"
additional_redirect_urls = [
  "http://localhost:8081/auth/callback",
  "http://127.0.0.1:8081/auth/callback",
  "schedulemasters://auth/callback",
  "http://localhost:3000/**",
]

[auth.email]
# Local Auth must exercise the same confirmation path as the deployed app.
enable_confirmations = true

[auth.rate_limit]
# Local mail is captured by Mailpit; allow the five-language CI smoke test.
email_sent = 60

[auth.email.template.confirmation]
subject = "{{ if eq (printf \"%v\" .Data.locale) \"cz\" }}Schedule Masters — Potvrďte svůj e-mail{{ else if eq (printf \"%v\" .Data.locale) \"sk\" }}Schedule Masters — Potvrďte svoj e-mail{{ else if eq (printf \"%v\" .Data.locale) \"ru\" }}Schedule Masters — Подтвердите email{{ else if eq (printf \"%v\" .Data.locale) \"uk\" }}Schedule Masters — Підтвердьте email{{ else }}Schedule Masters — Confirm your email{{ end }}"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ if eq (printf \"%v\" .Data.locale) \"cz\" }}Schedule Masters — Obnovit heslo{{ else if eq (printf \"%v\" .Data.locale) \"sk\" }}Schedule Masters — Obnoviť heslo{{ else if eq (printf \"%v\" .Data.locale) \"ru\" }}Schedule Masters — Восстановление пароля{{ else if eq (printf \"%v\" .Data.locale) \"uk\" }}Schedule Masters — Відновлення пароля{{ else }}Schedule Masters — Reset your password{{ end }}"
content_path = "./supabase/templates/recovery.html"

[functions.translate-service-content]
verify_jwt = true

[functions.send-booking-decision-emails]
verify_jwt = true

[functions.send-platform-budget-alerts]
verify_jwt = true

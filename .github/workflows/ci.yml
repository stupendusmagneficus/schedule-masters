name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Format check
        run: yarn format:check
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Verify Archify installation
        run: yarn archify:doctor
      - name: Build shared packages
        run: yarn turbo run build --filter=./packages/*

  app-builds:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: mobile
            filter: "@schedule-app/mobile"
          - app: booking-web
            filter: "@schedule-app/booking-web"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build application
        run: yarn turbo run build --filter=${{ matrix.filter }}

  supabase:
    name: Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Start local Supabase
        run: yarn supabase:start > /dev/null 2>&1
      - name: Apply migrations and seed
        run: yarn supabase:reset
      - name: Lint local database
        run: npx supabase@2.117.0 db lint --local
      - name: Run Supabase integration tests
        shell: bash
        run: |
          eval "$(npx supabase@2.117.0 status -o env)"
          SUPABASE_URL="$API_URL" SUPABASE_PUBLISHABLE_KEY="$ANON_KEY" yarn test:integration
      - name: Regenerate database types
        run: yarn supabase:types
      - name: Verify generated types are committed
        run: git diff --exit-code -- packages/api/src/supabase/database.types.ts
      - name: Stop local Supabase
        if: always()
        run: yarn supabase:stop > /dev/null 2>&1 || true

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Install Playwright browser
        run: yarn playwright install --with-deps chromium
      - name: Run web and mobile-web E2E tests
        run: yarn test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

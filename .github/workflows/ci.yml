name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build

  supabase:
    name: Supabase migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Start local Supabase
        run: yarn supabase:start > /dev/null 2>&1
      - name: Apply migrations and seed
        run: yarn supabase:reset
      - name: Regenerate database types
        run: yarn supabase:types
      - name: Verify generated types are committed
        run: git diff --exit-code -- packages/api/src/supabase/database.types.ts
      - name: Stop local Supabase
        if: always()
        run: yarn supabase:stop > /dev/null 2>&1 || true

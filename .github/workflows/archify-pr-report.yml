name: Publish Archify PR Report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  publish-report:
    name: Publish Archify report
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0]
    runs-on: ubuntu-latest
    steps:
      - name: Find Archify artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.payload.workflow_run.id;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId },
            );
            const report = artifacts.find(
              (artifact) => artifact.name === "archify-report" && !artifact.expired,
            );

            core.setOutput("artifact-id", report?.id ?? "");
            core.setOutput(
              "pr-number",
              context.payload.workflow_run.pull_requests[0]?.number ?? "",
            );

      - name: Download Archify report
        if: steps.artifact.outputs.artifact-id != ''
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.artifact.outputs.artifact-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: archify-report
          run-id: ${{ github.event.workflow_run.id }}

      - name: Create or update PR report comment
        if: steps.artifact.outputs.artifact-id != ''
        uses: actions/github-script@v7
        env:
          ARCHIFY_ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          PR_NUMBER: ${{ steps.artifact.outputs.pr-number }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- archify-report -->";
            const report = JSON.parse(
              fs.readFileSync("archify-report/report.json", "utf8"),
            );
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${process.env.WORKFLOW_RUN_ID}/artifacts/${process.env.ARCHIFY_ARTIFACT_ID}`;
            const rows = report.diagrams.length
              ? report.diagrams
                  .map(
                    (diagram) =>
                      `| \`${diagram.source}\` | ${diagram.validation} | ${diagram.delivery} | ${diagram.visualCheck} |`,
                  )
                  .join("\n")
              : "| No changed diagram sources | skipped | skipped | skipped |";
            const body = [
              marker,
              "## Archify visual report",
              "",
              "The architecture report was generated automatically by CI.",
              "",
              "| Diagram | Validation | Delivery | Visual check |",
              "| --- | --- | --- | --- |",
              rows,
              "",
              `[Download the HTML, PNG, and contact-sheet artifacts](${artifactUrl})`,
              "",
              "Review the visual report before merging changes that affect architecture diagrams.",
            ].join("\n");
            const issueNumber = Number(process.env.PR_NUMBER);
            const { owner, repo } = context.repo;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number: issueNumber },
            );
            const existing = comments.find((comment) =>
              comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body,
              });
            }

            await core.summary
              .addHeading("Archify visual report")
              .addLink("Download report artifacts", artifactUrl)
              .write();
